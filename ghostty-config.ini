font-family = JetBrainsMono Nerd Font Mono
theme = Man Page helo

# Disable contextual alternates (main ligature feature: merges != -> ≠, -> becomes →, etc.)
font-feature = -calt
# Disable standard ligatures (e.g. fi, fl, and some programming symbol ligatures)
font-feature = -liga
# Disable discretionary ligatures (optional/decorative ligatures some fonts apply to symbols) - not needed right now, may enable later
# font-feature = -dlig

# macOS: left Option sends Alt/Meta (for nvim <M-...> mappings), right Option
# still types Swedish-layout symbols like @ [ ] { } |. Ignored on Linux.
macos-option-as-alt = left
